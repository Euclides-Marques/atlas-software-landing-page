<!doctype html>
<!--
  Template da imagem de compartilhamento (public/og-image.png, 1200x630).
  Gerado com: node scripts/generate-og-image.mjs
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Sora';
        src: url('../node_modules/@fontsource-variable/sora/files/sora-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 800;
      }
      @font-face {
        font-family: 'Plex Mono';
        src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: #050b1a;
        background-image:
          linear-gradient(to right, rgb(124 196 255 / 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(124 196 255 / 0.07) 1px, transparent 1px);
        background-size: 48px 48px;
        display: grid;
        grid-template-columns: 1fr 380px;
        align-items: center;
        gap: 48px;
        padding: 0 80px;
        color: #fff;
        font-family: 'Sora', sans-serif;
      }
      .label {
        font-family: 'Plex Mono', monospace;
        font-size: 18px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7cc4ff;
      }
      h1 {
        margin-top: 28px;
        font-size: 62px;
        line-height: 1.06;
        letter-spacing: -0.035em;
        font-weight: 600;
      }
      h1 span { color: #4b93f7; }
      p {
        margin-top: 28px;
        font-size: 24px;
        color: #9ba7c0;
        font-weight: 400;
      }
      img { width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <div>
      <div class="label">Desenvolvimento sob medida</div>
      <h1>Sites e sistemas feitos para o jeito que o seu negócio <span>funciona.</span></h1>
      <p>Sites · Landing pages · Sistemas web · Integrações</p>
    </div>
    <img src="../src/assets/brand/atlas-lockup.webp" alt="" />
  </body>
</html>
