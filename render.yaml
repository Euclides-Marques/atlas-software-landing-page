# Blueprint do Render (opcional): permite criar o serviço por "New > Blueprint".
# A mesma configuração pode ser feita manualmente pelo painel (ver README).
services:
  - type: web
    runtime: static
    name: atlas-software-landing-page
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
